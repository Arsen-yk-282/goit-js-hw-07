<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Search</title>
    <script type="module" crossorigin src="/goit-js-hw-12/assets/index-BQw7hTz_.js"></script>
    <link rel="stylesheet" crossorigin href="/goit-js-hw-12/assets/index-MkKaqseI.css">

  <body>
    <main class="container">
      <form class="form">
        <label>
          <input
            type="text"
            name="search-text"
